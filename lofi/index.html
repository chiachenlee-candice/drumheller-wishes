<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Drumheller Wishes Wireframe</title>
<style>
:root{--ink:#111;--mid:#777;--line:#bbb;--fill:#eee;--paper:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* screens: plain white pages; only the toss screen shows the camera */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;gap:10px;background:var(--paper);padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px)}
.screen.see-through{background:transparent;pointer-events:none}
.screen.see-through>*{pointer-events:auto}
.top{display:flex;align-items:center;gap:8px;min-height:40px}
.title{flex:1;font-weight:800;font-size:20px;line-height:1.1}
.title small{display:block;font-weight:400;font-size:13px;color:var(--mid)}
.boxed{background:var(--paper);border:2px solid var(--ink);padding:6px 10px;font-size:17px}
.btn{border:2px solid var(--ink);background:var(--paper);padding:12px 14px;font-weight:700;border-radius:0}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.sm{padding:6px 10px;font-size:14px;font-weight:600}
.link{background:none;border:0;text-decoration:underline;text-underline-offset:3px;color:var(--ink);padding:8px;font-size:15px}
.spacer{flex:1}
.note{font-size:13px;color:var(--mid);margin:0;text-align:center}
.center{display:flex;flex-direction:column;align-items:center;gap:10px}

/* line-art fountain (landing + toss fallback). Basin geometry is shared with JS. */
.stage{position:relative;width:min(86vw,380px);aspect-ratio:300/260;margin:0 auto}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.stage svg *{stroke-linecap:round;stroke-linejoin:round}
#target{position:absolute;left:10%;width:80%;top:calc(178/260*100%);height:calc(44/260*100%);border:3px dashed #fff;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.5),inset 0 0 0 2px rgba(0,0,0,.5)}
#target span{position:absolute;left:50%;top:-30px;transform:translateX(-50%);white-space:nowrap;font-size:12px;background:var(--paper);border:1px solid var(--ink);padding:1px 6px}

/* coins */
.coin{border-radius:50%;border:3px solid var(--ink);background:var(--paper);display:block;overflow:hidden;padding:0}
.coin img{width:100%;height:100%;display:block;pointer-events:none}
.pad{width:min(70vw,280px);height:auto;aspect-ratio:1;touch-action:none;cursor:crosshair}
.signhead{display:flex;justify-content:space-between;align-items:center;width:min(86vw,340px)}
.signhead span{font-weight:700;font-size:20px}

/* wish page: coin on top, lined message area below */
.datechip{font-size:14px;color:var(--mid)}
.bigcoin{width:min(46vw,200px);aspect-ratio:1;margin:4px auto 0}
.lined{display:block;width:100%;flex:1;min-height:140px;max-height:260px;resize:none;border:0;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:4px 2px;font:20px/36px "Bradley Hand","Segoe Print","Comic Sans MS",cursive;background:repeating-linear-gradient(transparent 0 35px,var(--line) 35px 36px);background-attachment:local;outline:none;-webkit-user-select:text;user-select:text;border-radius:0}
.lined.read{white-space:pre-wrap;overflow:auto;margin:0;-webkit-user-select:text;user-select:text}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--ink)}

/* toss */
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
#tossStage{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%)}
#tossCoin{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 60px);width:120px;height:120px;margin-left:-60px;touch-action:none;z-index:5;background:var(--paper)}
#tossCoin.flying{transition:transform .65s cubic-bezier(.3,.6,.4,1)}
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 196px);transform:translateX(-50%);text-align:center;font-weight:700;background:var(--paper);border:2px solid var(--ink);padding:6px 12px;white-space:nowrap;z-index:4}
.hint b{display:block;font-size:22px;line-height:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}

/* coin collection popup */
#s-coll{top:auto;height:92%;border-top:2px solid var(--ink);box-shadow:0 -10px 40px rgba(0,0,0,.25);transform:translateY(0);transition:transform .35s ease;z-index:8}
#s-coll.off{transform:translateY(105%)}
.tabs{display:flex;flex:1;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.tabs button{flex:1;border:0;background:var(--paper);padding:8px 6px;font-weight:700;font-size:15px}
.tabs button+button{border-left:2px solid var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.banner{border:2px solid var(--ink);padding:8px 12px;font-weight:700;text-align:center}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:18px 16px;align-content:start;padding:6px 4px 20px}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0}
.cell .coin{width:100%;max-width:140px;aspect-ratio:1}
.cell.new .coin{border-width:5px}
.cell small{font-size:12px;color:var(--mid)}
.cell small b{color:var(--ink)}
.empty{grid-column:1/-1;text-align:center;color:var(--mid);padding:30px 0}
#s-view{z-index:9}

/* map */
.loc{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;font-size:18px}
.loc.here{border-width:4px}
.loc small{font-size:12px;font-weight:600}

#toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;font-size:14px;z-index:20;max-width:86vw;text-align:center}
.badge{position:fixed;right:6px;bottom:calc(env(safe-area-inset-bottom) + 2px);font-size:10px;color:var(--mid);letter-spacing:.1em;pointer-events:none;z-index:30}
</style>
</head>

<!-- 1. LANDING -->
<section class="screen" id="s-home">
  <div class="top">
    <div class="title">Drumheller Fountain<small>Welcome! Make a wish here.</small></div>
    <button class="btn sm" data-go="map">Map →</button>
  </div>
  <div class="spacer"></div>
  <div class="stage" data-art></div>
  <div class="spacer"></div>
  <div class="center">
    <button class="btn primary" style="min-width:220px" data-go="design" data-new>Toss a coin</button>
    <button class="link" data-coll="all">See everyone's coins</button>
  </div>
</section>

<!-- MAP: visit other locations -->
<section class="screen" id="s-map" hidden>
  <div class="top"><button class="btn sm" data-go="home">← Back</button><div class="title">Visit other locations</div></div>
  <div class="center" style="margin-top:12px">
    <button class="btn loc" data-soon>The Quad <small>›</small></button>
    <button class="btn loc" data-soon>Suzallo Library <small>›</small></button>
    <button class="btn loc here" data-go="home">Drumheller Fountain <small>You are here</small></button>
  </div>
  <p class="note" style="margin-top:8px">Only Drumheller Fountain works in this prototype.</p>
</section>

<!-- 2. DESIGN: sign the coin -->
<section class="screen" id="s-design" hidden>
  <div class="top"><button class="btn sm" data-go="home">← Back</button><div class="title"><span class="boxed">Design coin</span></div></div>
  <div class="spacer"></div>
  <div class="center">
    <div class="signhead"><span>Sign the coin!</span><button class="btn sm" id="clearPad">Clear</button></div>
    <canvas id="pad" class="coin pad" width="480" height="480" aria-label="Your coin. Draw or sign on it with your finger."></canvas>
    <p class="note">Draw or sign with your finger</p>
  </div>
  <div class="spacer"></div>
  <button class="btn primary" id="toWish">Next →</button>
</section>

<!-- 3. WISH: coin on top, message below -->
<section class="screen" id="s-wish" hidden>
  <div class="top"><button class="btn sm" data-go="design">← Back</button><div class="spacer"></div><span class="datechip" id="wishDate"></span></div>
  <div class="coin bigcoin"><img id="wishCoin" alt="Your coin"></div>
  <label for="wishText" style="font-weight:700;margin-top:6px">Write your wish</label>
  <textarea id="wishText" class="lined" maxlength="160" placeholder="I wish…"></textarea>
  <label class="check" for="priv"><input type="checkbox" id="priv"> Keep my wish private (others only see my coin)</label>
  <button class="btn primary" id="toToss">Next: toss it →</button>
</section>

<!-- 4. TOSS: camera turns on here only -->
<video id="cam" playsinline muted autoplay hidden></video>
<section class="screen see-through" id="s-toss" hidden>
  <div class="top"><button class="btn sm" data-go="wish">← Back</button><div class="spacer"></div><button class="btn sm" id="camBtn">Camera</button></div>
</section>
<div class="stage" id="tossStage" hidden><div id="tossArt" data-art></div><div id="target" hidden><span>Aim at the fountain</span></div></div>
<div class="hint" id="tossHint" hidden><b>↑</b>Swipe up to toss</div>
<div class="coin" id="tossCoin" hidden><img id="tcImg" alt="Your coin"></div>
<canvas id="fx"></canvas>

<!-- 5. COIN COLLECTION (pops up after the toss) -->
<section class="screen off" id="s-coll" hidden>
  <div class="top"><button class="btn sm" id="collClose" aria-label="Close">✕</button>
    <div class="tabs" role="tablist"><button role="tab" id="tabMine" aria-selected="true">Your coin</button><button role="tab" id="tabAll" aria-selected="false">All coins</button></div>
  </div>
  <div class="banner" id="splashBanner" hidden>Splash! Your coin is in the fountain.</div>
  <div class="grid" id="grid"></div>
</section>

<!-- 6. VIEW ONE COIN -->
<section class="screen" id="s-view" hidden>
  <div class="top"><button class="btn sm" id="viewBack">← Back</button><div class="spacer"></div><span class="datechip" id="viewDate"></span></div>
  <div class="coin bigcoin"><img id="viewCoin" alt=""></div>
  <p style="font-weight:700;margin:6px 0 0" id="viewWho"></p>
  <p class="lined read" id="viewText"></p>
</section>

<div id="toast" hidden></div>
<div class="badge">LO-FI WIREFRAME</div>

<script>
const $ = s => document.querySelector(s);
document.querySelectorAll('[data-art]').forEach(el => el.appendChild($('#fountainArt').content.cloneNode(true)));
const esc = s => s.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const today = () => new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

/* ---------- data ---------- */
const SAMPLES = [
  {id:'s1',sig:'Mika',doodle:'star',wish:'Pass my qualifying exam this spring.',date:'Nov 12, 2026'},
  {id:'s2',sig:'JL',doodle:'heart',wish:'That my grandma gets to visit Seattle next year.',date:'Nov 10, 2026'},
  {id:'s3',sig:'Ari',doodle:'',wish:'',priv:true,date:'Nov 9, 2026'},
  {id:'s4',sig:'T.S.',doodle:'smile',wish:'Find a summer internship I actually love.',date:'Nov 7, 2026'},
  {id:'s5',sig:'Dan',doodle:'mountain',wish:'Clear skies so we can see Mt. Rainier at graduation.',date:'Nov 3, 2026'},
];
// Sample coins look hand-signed: a cursive name plus a quick doodle.
function sampleImg(c){
  const S=240, cv=document.createElement('canvas'); cv.width=cv.height=S; const g=cv.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,S,S); engrave(g,S); g.strokeStyle=g.fillStyle='#111'; g.lineWidth=5; g.lineCap=g.lineJoin='round';
  g.font='italic 42px "Bradley Hand","Segoe Print","Comic Sans MS",cursive'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(c.sig, S/2, c.doodle ? S*.66 : S/2);
  const x=S/2, y=S*.32; g.beginPath();
  if (c.doodle==='star'){ for(let i=0;i<10;i++){const r=i%2?14:34,a=-Math.PI/2+i*Math.PI/5; g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);} g.closePath(); }
  if (c.doodle==='heart'){ g.moveTo(x,y+28); g.bezierCurveTo(x-48,y-4,x-24,y-38,x,y-14); g.bezierCurveTo(x+24,y-38,x+48,y-4,x,y+28); }
  if (c.doodle==='smile'){ g.arc(x,y,30,0,Math.PI*2); g.moveTo(x-16,y+6); g.quadraticCurveTo(x,y+22,x+16,y+6); g.moveTo(x-10,y-8); g.arc(x-10,y-8,1,0,7); g.moveTo(x+10,y-8); g.arc(x+10,y-8,1,0,7); }
  if (c.doodle==='mountain'){ g.moveTo(x-50,y+24); g.lineTo(x-8,y-26); g.lineTo(x+14,y); g.lineTo(x+26,y-12); g.lineTo(x+52,y+24); }
  g.stroke(); return cv.toDataURL();
}
// Faint engraving on every blank coin: beaded rim, curved lettering, and a ghosted fountain in the middle.
function arcText(g, str, R, size, bottom){
  g.save(); g.font = `600 ${size}px Georgia,"Times New Roman",serif`; g.textAlign='center'; g.textBaseline='middle';
  const ws = [...str].map(ch => g.measureText(ch).width + size*.18), total = ws.reduce((a,b)=>a+b,0)/R;
  let a = bottom ? Math.PI/2 + total/2 : -Math.PI/2 - total/2;
  [...str].forEach((ch,i) => { const w = ws[i]/R; a += bottom ? -w/2 : w/2;
    g.save(); g.rotate(a + (bottom ? -Math.PI/2 : Math.PI/2)); g.fillText(ch, 0, bottom ? R : -R); g.restore();
    a += bottom ? -w/2 : w/2; });
  g.restore();
}
function engrave(g, S){
  const r = S/2; g.save(); g.translate(r, r);
  g.strokeStyle = '#dcdcdc'; g.lineWidth = S*.006; g.beginPath(); g.arc(0,0,r*.84,0,Math.PI*2); g.stroke();
  g.fillStyle = '#d6d6d6'; for (let i=0;i<72;i++){ const a=i/72*Math.PI*2; g.beginPath(); g.arc(Math.cos(a)*r*.93, Math.sin(a)*r*.93, S*.005, 0, Math.PI*2); g.fill(); }
  g.fillStyle = '#d2d2d2';
  arcText(g, 'DRUMHELLER FOUNTAIN', r*.72, S*.056, false);
  arcText(g, 'MAKE A WISH', r*.72, S*.056, true);
  g.font = `${S*.04}px Georgia,serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText('✦', -r*.72, 0); g.fillText('✦', r*.72, 0);
  // ghosted fountain: tall jet with a falling crown, shallow basin
  g.strokeStyle = '#ececec'; g.lineWidth = S*.012; g.lineCap = 'round';
  g.beginPath(); g.moveTo(0, r*.3); g.lineTo(0, -r*.42); g.stroke();
  for (const sx of [-1,1]) { g.beginPath(); g.moveTo(0, -r*.42); g.quadraticCurveTo(sx*r*.16, -r*.46, sx*r*.22, -r*.16); g.stroke(); }
  g.beginPath(); g.ellipse(0, r*.32, r*.5, r*.09, 0, 0, Math.PI*2); g.stroke();
  g.restore();
}
SAMPLES.forEach(c => c.img = sampleImg(c));
let mine = [];
try { mine = JSON.parse(localStorage.getItem('lofi-coins-v3')) || []; } catch(e) {}
const save = () => { try { localStorage.setItem('lofi-coins-v3', JSON.stringify(mine)); } catch(e) {} };
const all = () => [...mine.slice().reverse(), ...SAMPLES];
const draft = {img:'', wish:'', priv:false};

/* ---------- navigation ---------- */
let cur = 'home';
function show(name){
  document.querySelectorAll('#s-home,#s-map,#s-design,#s-wish,#s-toss').forEach(s => s.hidden = s.id !== 's-'+name);
  cur = name; $('#toast').hidden = true;
  const tossing = name === 'toss';
  ['#tossStage','#tossCoin','#tossHint'].forEach(q => $(q).hidden = !tossing);
  if (tossing) { resetToss(); if (!noCam) camOn(); } else camOff();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (b) { if (b.hasAttribute('data-new')) resetDraft(); show(b.dataset.go); return; }
  const c = e.target.closest('[data-coll]'); if (c) openColl(c.dataset.coll, false);
  if (e.target.closest('[data-soon]')) toast('Coming soon. Only Drumheller Fountain works in this prototype.');
});
function resetDraft(){ draft.img=''; draft.wish=''; draft.priv=false; $('#wishText').value=''; $('#priv').checked=false; clearPad(); }

/* ---------- design: draw on the coin ---------- */
const pad = $('#pad'), pg = pad.getContext('2d');
let inked = false, stroke = null;
function clearPad(){ pg.fillStyle='#fff'; pg.fillRect(0,0,pad.width,pad.height); engrave(pg,pad.width); inked=false; }
function padXY(e){ const r=pad.getBoundingClientRect(); return [(e.clientX-r.left)*pad.width/r.width, (e.clientY-r.top)*pad.height/r.height]; }
pad.addEventListener('pointerdown', e => { e.preventDefault(); pad.setPointerCapture(e.pointerId); stroke = padXY(e);
  pg.fillStyle='#111'; pg.beginPath(); pg.arc(stroke[0],stroke[1],5,0,Math.PI*2); pg.fill(); inked = true; });
pad.addEventListener('pointermove', e => { if (!stroke) return; const p = padXY(e);
  pg.strokeStyle='#111'; pg.lineWidth=10; pg.lineCap=pg.lineJoin='round';
  pg.beginPath(); pg.moveTo(stroke[0],stroke[1]); pg.lineTo(p[0],p[1]); pg.stroke(); stroke = p; });
['pointerup','pointercancel','pointerleave'].forEach(t => pad.addEventListener(t, () => stroke = null));
$('#clearPad').onclick = clearPad;
function padImage(){ const c=document.createElement('canvas'); c.width=c.height=240; c.getContext('2d').drawImage(pad,0,0,240,240); return c.toDataURL(); }
$('#toWish').onclick = () => {
  if (!inked) { toast('Sign or draw on the coin first'); return; }
  draft.img = padImage(); $('#wishCoin').src = draft.img; $('#wishDate').textContent = today(); show('wish');
};
$('#toToss').onclick = () => {
  draft.wish = $('#wishText').value.trim(); draft.priv = $('#priv').checked;
  if (!draft.wish) { toast('Write a wish first'); $('#wishText').focus(); return; }
  show('toss');
};

/* ---------- toss: swipe up, splash, then the collection pops up ---------- */
const tc = $('#tossCoin');
let drag = null, tossed = false;
function resetToss(){ tossed = false; tc.classList.remove('flying'); tc.style.transform = ''; tc.style.visibility = ''; $('#tossHint').hidden = false; $('#tcImg').src = draft.img; }
tc.addEventListener('pointerdown', e => { if (tossed) return; tc.setPointerCapture(e.pointerId); drag = {y:e.clientY, x:e.clientX, t:performance.now(), dy:0, dx:0}; });
tc.addEventListener('pointermove', e => { if (!drag) return; drag.dy = e.clientY - drag.y; drag.dx = e.clientX - drag.x;
  tc.style.transform = `translate(${drag.dx*.3}px, ${Math.min(0, drag.dy)}px)`; });
tc.addEventListener('pointerup', endDrag); tc.addEventListener('pointercancel', endDrag);
function endDrag(){
  if (!drag) return; const d = drag; drag = null;
  const v = -d.dy / Math.max(1, performance.now() - d.t);
  if (d.dy < -90 || (d.dy < -30 && v > .5)) return toss();
  tc.style.transform = '';
  if (Math.abs(d.dy) < 10) toast('Swipe up on the coin to toss it');
}
function basinPoint(){
  // Inner water ellipse of the line-art fountain: cx 150, cy 200, rx 120, ry 22 in a 300x260 box.
  const r = $('#tossStage').getBoundingClientRect(), k = r.width/300;
  const a = Math.random()*Math.PI*2, d = Math.sqrt(Math.random())*.7;
  return {x: r.left + (150 + Math.cos(a)*120*d)*k, y: r.top + (200 + Math.sin(a)*22*d)*k, k};
}
function toss(){
  tossed = true; $('#tossHint').hidden = true;
  const p = basinPoint(), c = tc.getBoundingClientRect();
  tc.classList.add('flying');
  tc.style.transform = `translate(${p.x-(c.left+c.width/2)}px, ${p.y-(c.top+c.height/2)}px) scale(.12)`;
  const coin = {id:'m'+Date.now(), img:draft.img, wish:draft.wish, priv:draft.priv, date:today(), mine:true};
  mine.push(coin); save();
  setTimeout(() => { tc.style.visibility = 'hidden'; splash(p.x, p.y, p.k); }, 650);
  setTimeout(() => openColl('mine', true, coin.id), 650 + 1300);
}

/* splash: ripples + droplets on a canvas over the scene */
const fx = $('#fx'), fg = fx.getContext('2d');
let drops = [], rings = [], raf = 0;
function sizeFx(){ const d = Math.min(2, devicePixelRatio||1); fx.width = innerWidth*d; fx.height = innerHeight*d; fg.setTransform(d,0,0,d,0,0); }
addEventListener('resize', sizeFx); sizeFx();
function splash(x, y, k){
  const onCam = !!stream, col = onCam ? '255,255,255' : '17,17,17';
  for (let i=0;i<3;i++) rings.push({x,y,max:(60+i*35)*k,age:-i*.15,life:1.1,col});
  for (let i=0;i<40;i++){ const a = -Math.PI/2 + (Math.random()-.5)*1.4, v = 180 + Math.random()*260;
    drops.push({x,y,vx:Math.cos(a)*v*.7,vy:Math.sin(a)*v,floor:y+Math.random()*6,r:1.5+Math.random()*2.5,col}); }
  if (navigator.vibrate) try { navigator.vibrate(30); } catch(e) {}
  cancelAnimationFrame(raf); let last = performance.now();
  const step = now => { const dt = Math.min(.05,(now-last)/1000); last = now;
    fg.clearRect(0,0,innerWidth,innerHeight);
    rings = rings.filter(r => { r.age += dt; if (r.age < 0) return true; const t = r.age/r.life; if (t >= 1) return false;
      fg.strokeStyle = `rgba(${r.col},${1-t})`; fg.lineWidth = 2.5*(1-t)+.5; fg.beginPath(); fg.ellipse(r.x,r.y,r.max*t,r.max*t*.2,0,0,Math.PI*2); fg.stroke(); return true; });
    drops = drops.filter(p => { p.vy += 900*dt; p.x += p.vx*dt; p.y += p.vy*dt; if (p.vy > 0 && p.y > p.floor) return false;
      fg.fillStyle = `rgba(${p.col},.9)`; fg.beginPath(); fg.arc(p.x,p.y,p.r,0,Math.PI*2); fg.fill(); return true; });
    if (rings.length || drops.length) raf = requestAnimationFrame(step); else fg.clearRect(0,0,innerWidth,innerHeight);
  };
  raf = requestAnimationFrame(step);
}

/* ---------- coin collection popup ---------- */
let collTab = 'mine', fresh = null;
function openColl(tab, afterToss, newId){
  collTab = tab; fresh = newId || null; $('#splashBanner').hidden = !afterToss;
  renderGrid(); const s = $('#s-coll'); s.hidden = false; s.classList.add('off');
  requestAnimationFrame(() => requestAnimationFrame(() => s.classList.remove('off')));
}
function closeColl(){ const s = $('#s-coll'); s.classList.add('off'); setTimeout(() => { s.hidden = true; }, 350); }
$('#collClose').onclick = () => { closeColl(); if (cur !== 'home') show('home'); };
$('#tabMine').onclick = () => { collTab = 'mine'; renderGrid(); };
$('#tabAll').onclick = () => { collTab = 'all'; renderGrid(); };
function renderGrid(){
  $('#tabMine').setAttribute('aria-selected', collTab==='mine'); $('#tabAll').setAttribute('aria-selected', collTab==='all');
  const list = collTab === 'mine' ? all().filter(c => c.mine) : all();
  $('#grid').innerHTML = list.length ? list.map(c => `<button class="cell${c.id===fresh?' new':''}" data-id="${c.id}">
      <span class="coin"><img src="${c.img}" alt=""></span><small>${c.id===fresh?'<b>Just tossed</b> · ':c.mine?'<b>Yours</b> · ':''}${c.date}</small></button>`).join('')
    : `<p class="empty">You haven't tossed a coin yet.</p>`;
}
$('#grid').addEventListener('click', e => { const b = e.target.closest('.cell'); if (b) openView(b.dataset.id); });

/* ---------- view one coin ---------- */
function openView(id){
  const c = all().find(x => x.id === id); if (!c) return;
  $('#viewCoin').src = c.img; $('#viewDate').textContent = c.date;
  $('#viewWho').textContent = c.mine ? 'Your coin' + (c.priv ? ' (wish kept private)' : '') : "A visitor's coin";
  $('#viewText').innerHTML = c.priv && !c.mine ? '<i>This wish is private.</i>' : esc(c.wish);
  $('#s-view').hidden = false;
}
$('#viewBack').onclick = () => $('#s-view').hidden = true;

/* ---------- camera (toss screen only) ---------- */
const noCam = new URLSearchParams(location.search).has('nocam');
let stream = null, camWanted = true;
async function camOn(){
  if (stream || !camWanted) return applyCam();
  try { stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    if (cur !== 'toss') { camOff(); return; }
    const v = $('#cam'); v.srcObject = stream; await v.play().catch(()=>{});
  } catch(e) { stream = null; camWanted = false; toast('Camera not available. Showing the drawing instead.'); }
  applyCam();
}
function camOff(){ if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; applyCam(); }
function applyCam(){
  const on = !!stream; $('#cam').hidden = !on; $('#tossArt').hidden = on; $('#target').hidden = !on;
  $('#camBtn').textContent = on ? 'Camera: on' : 'Camera: off';
}
$('#camBtn').onclick = () => { if (stream) { camWanted = false; camOff(); } else { camWanted = true; camOn(); } };

let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true, 2400); }

clearPad(); applyCam(); show('home');
</script>
</body>
</html>
