<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Drumheller Wishes Wireframe</title>
<style>
:root{--ink:#111;--mid:#777;--line:#bbb;--fill:#eee;--paper:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* background: camera or placeholder */
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(.9) brightness(1.05)}
#ph{position:fixed;inset:0;background:var(--fill)}
#ph svg{position:absolute;inset:0;width:100%;height:100%}
#ph span{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:12px;letter-spacing:.12em;color:var(--mid);background:var(--fill);padding:2px 8px}

/* fountain basin marker */
#basin{position:fixed;left:50%;top:50%;width:min(84vw,420px);aspect-ratio:2.6;transform:translate(-50%,-50%);border:2px dashed var(--ink);border-radius:50%;background:rgba(255,255,255,.35)}
#basin>.tag{position:absolute;left:50%;top:-26px;transform:translateX(-50%);font-size:12px;background:var(--paper);border:1px solid var(--ink);padding:1px 6px;white-space:nowrap}
.dot{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);padding:0}
.dot img{width:100%;height:100%;border-radius:50%;display:block;pointer-events:none}
.dot.mine{border-width:4px}
.dot.mine::after{content:"You";position:absolute;left:50%;top:-17px;transform:translateX(-50%);font-size:10px;font-weight:700;background:var(--ink);color:var(--paper);padding:0 4px}
.dot.sel{outline:3px solid var(--ink);outline-offset:3px}

/* chrome */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);pointer-events:none}
.screen>*{pointer-events:auto}
.top{display:flex;align-items:center;gap:8px}
.title{flex:1;background:var(--paper);border:2px solid var(--ink);padding:6px 10px;font-weight:700}
.title small{display:block;font-weight:400;font-size:12px;color:var(--mid)}
.btn{border:2px solid var(--ink);background:var(--paper);padding:12px 14px;font-weight:700;border-radius:0}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.sm{padding:6px 10px;font-size:14px;font-weight:600}
.spacer{flex:1;pointer-events:none}
.stack{display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{background:var(--paper);border:2px solid var(--ink);padding:14px}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);margin:0 0 6px}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.opt{border:2px solid var(--line);background:var(--paper);padding:6px 10px;font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
input,textarea{font:inherit;width:100%;border:2px solid var(--ink);padding:8px;border-radius:0;background:var(--paper)}
textarea{height:96px;resize:none}
.note{font-size:13px;color:var(--mid);margin:6px 0 0}
.steps{font-size:12px;color:var(--mid);text-align:center;margin:4px 0 8px}

/* coin wireframe */
.coin{width:150px;height:150px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);display:grid;place-items:center;text-align:center;margin:0 auto 12px;position:relative}
.coin img{width:100%;height:100%;border-radius:50%;display:block;pointer-events:none}
.pad{width:min(68vw,280px);height:auto;aspect-ratio:1;touch-action:none;cursor:crosshair;display:block;padding:0}
.signhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.signhead span{font-weight:700;font-size:18px}
.card.has-coin{display:flex;gap:12px;align-items:flex-start}
.card .thumb{flex:0 0 64px;height:64px;border-radius:50%;border:2px solid var(--ink)}

/* toss */
#tossCoin{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 70px);transform:translateX(-50%);touch-action:none;margin:0;width:120px;height:120px;transition:none;pointer-events:auto;z-index:5}
#tossCoin.flying{transition:transform .7s cubic-bezier(.3,.6,.4,1),opacity .7s}
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 200px);transform:translateX(-50%);text-align:center;font-weight:700;background:var(--paper);border:2px solid var(--ink);padding:6px 12px;white-space:nowrap}
.hint .arrow{display:block;font-size:22px;line-height:1}

/* wish card */
.card{background:var(--paper);border:2px solid var(--ink);padding:14px}
.card h3{margin:0 0 4px;font-size:18px}
.card p{margin:0}
.card .meta{font-size:12px;color:var(--mid);margin-top:8px}

#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;font-size:14px;z-index:9;max-width:86vw;text-align:center}
.badge{position:fixed;right:6px;bottom:calc(env(safe-area-inset-bottom) + 2px);font-size:10px;color:var(--mid);letter-spacing:.1em;pointer-events:none;z-index:1}
</style>
</head>
<body>

<video id="cam" playsinline muted autoplay hidden></video>
<div id="ph">
  <svg preserveAspectRatio="none" viewBox="0 0 100 100"><line x1="0" y1="0" x2="100" y2="100" stroke="#ccc" stroke-width=".3"/><line x1="100" y1="0" x2="0" y2="100" stroke="#ccc" stroke-width=".3"/></svg>
  <span>CAMERA VIEW</span>
</div>
<div id="basin"><span class="tag">Fountain basin</span><div id="dots"></div></div>

<!-- 1. HOME -->
<section class="screen" id="s-home">
  <div class="top">
    <div class="title"><small>Welcome to</small>Drumheller Fountain</div>
    <button class="btn sm camBtn">Camera</button>
  </div>
  <div class="spacer"></div>
  <div class="stack">
    <button class="btn primary" data-go="design">Make a wish coin</button>
    <button class="btn" data-go="wishes">See everyone's wishes</button>
  </div>
</section>

<!-- 2a. DESIGN COIN: draw / sign -->
<section class="screen" id="s-design" hidden>
  <div class="top"><button class="btn sm" data-go="home">← Back</button><div class="title">Design coin</div></div>
  <div class="spacer"></div>
  <div class="panel">
    <div class="steps">Step 1 of 2</div>
    <div class="signhead"><span>Sign the coin!</span><button class="btn sm" id="clearPad">Clear</button></div>
    <canvas id="pad" class="coin pad" width="480" height="480" aria-label="Your coin. Draw or sign on it with your finger."></canvas>
    <p class="note" style="text-align:center">Draw or sign with your finger</p>
  </div>
  <div style="height:10px"></div>
  <button class="btn primary" id="toWish">Next →</button>
</section>

<!-- 2b. WRITE WISH -->
<section class="screen" id="s-wish" hidden>
  <div class="top"><button class="btn sm" data-go="design">← Back</button><div class="title">Write your wish</div></div>
  <div class="spacer"></div>
  <div class="panel">
    <div class="steps">Step 2 of 2</div>
    <p class="lbl"><label for="wishText">Your wish</label></p>
    <textarea id="wishText" maxlength="140" placeholder="I wish…"></textarea>
    <label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px"><input type="checkbox" id="priv" style="width:auto"> Keep my wish private (others only see my coin)</label>
  </div>
  <div style="height:10px"></div>
  <button class="btn primary" id="toToss">Done → go toss it</button>
</section>

<!-- 3. TOSS -->
<section class="screen" id="s-toss" hidden>
  <div class="top"><button class="btn sm" data-go="wish">← Back</button><div class="title">Toss your coin</div><button class="btn sm camBtn">Camera</button></div>
  <div class="spacer"></div>
</section>
<div class="hint" id="tossHint" hidden><span class="arrow">↑</span>Swipe up to toss</div>
<div class="coin" id="tossCoin" hidden><img id="tcImg" alt="Your coin"></div>

<!-- 3b. DONE -->
<section class="screen" id="s-done" hidden>
  <div class="top"><div class="title">Your coin is in the fountain!</div></div>
  <div class="spacer"></div>
  <div class="stack">
    <button class="btn primary" data-go="wishes">See everyone's wishes</button>
    <div class="row2"><button class="btn" data-go="design" data-new>Make another</button><button class="btn" data-go="home">Home</button></div>
  </div>
</section>

<!-- 4. WISHES -->
<section class="screen" id="s-wishes" hidden>
  <div class="top"><button class="btn sm" data-go="home">← Home</button><div class="title">Wishes in the fountain<small>Tap a coin to read its wish</small></div></div>
  <div class="spacer"></div>
  <div class="card" id="wishCard"></div>
</section>

<div id="toast" hidden></div>
<div class="badge">LO-FI WIREFRAME</div>

<script>
const $ = s => document.querySelector(s);
const SAMPLES = [
  {id:'s1',pos:{x:.22,y:.45},sig:'Mika',doodle:'star',wish:'Pass my qualifying exam this spring.',date:'Nov 12'},
  {id:'s2',pos:{x:.40,y:.28},sig:'JL',doodle:'heart',wish:'That my grandma gets to visit Seattle next year.',date:'Nov 10'},
  {id:'s3',pos:{x:.62,y:.30},sig:'Ari',doodle:'',wish:'',priv:true,date:'Nov 9'},
  {id:'s4',pos:{x:.78,y:.52},sig:'T.S.',doodle:'smile',wish:'Find a summer internship I actually love.',date:'Nov 7'},
  {id:'s5',pos:{x:.55,y:.72},sig:'Dan',doodle:'mountain',wish:'Clear skies so we can see Mt. Rainier at graduation.',date:'Nov 3'},
];
// Sample coins look hand-signed: a cursive name plus a quick doodle.
function sampleImg(c){
  const S=240, cv=document.createElement('canvas'); cv.width=cv.height=S; const g=cv.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,S,S); g.strokeStyle=g.fillStyle='#111'; g.lineWidth=5; g.lineCap=g.lineJoin='round';
  g.font='italic 42px "Bradley Hand","Segoe Print","Comic Sans MS",cursive'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(c.sig, S/2, c.doodle ? S*.66 : S/2);
  const x=S/2, y=S*.32; g.beginPath();
  if (c.doodle==='star'){ for(let i=0;i<10;i++){const r=i%2?14:34,a=-Math.PI/2+i*Math.PI/5; g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);} g.closePath(); }
  if (c.doodle==='heart'){ g.moveTo(x,y+28); g.bezierCurveTo(x-48,y-4,x-24,y-38,x,y-14); g.bezierCurveTo(x+24,y-38,x+48,y-4,x,y+28); }
  if (c.doodle==='smile'){ g.arc(x,y,30,0,Math.PI*2); g.moveTo(x-16,y+6); g.quadraticCurveTo(x,y+22,x+16,y+6); g.moveTo(x-10,y-8); g.arc(x-10,y-8,1,0,7); g.moveTo(x+10,y-8); g.arc(x+10,y-8,1,0,7); }
  if (c.doodle==='mountain'){ g.moveTo(x-50,y+24); g.lineTo(x-8,y-26); g.lineTo(x+14,y); g.lineTo(x+26,y-12); g.lineTo(x+52,y+24); }
  g.stroke(); return cv.toDataURL();
}
SAMPLES.forEach(c => c.img = sampleImg(c));
let mine = [];
try { mine = JSON.parse(localStorage.getItem('lofi-coins-v2')) || []; } catch(e) {}
const save = () => { try { localStorage.setItem('lofi-coins-v2', JSON.stringify(mine)); } catch(e) {} };

const draft = {img:'', wish:'', priv:false};

/* ---------- screens ---------- */
let cur = 'home';
function show(name){
  document.querySelectorAll('.screen').forEach(s => s.hidden = s.id !== 's-'+name);
  cur = name; $('#toast').hidden = true;
  const tossing = name === 'toss';
  $('#tossCoin').hidden = !tossing; $('#tossHint').hidden = !tossing;
  if (tossing) resetToss();
  $('#basin').style.display = (name==='design' || name==='wish') ? 'none' : '';
  renderDots(name === 'wishes' || name === 'done');
  if (name === 'wishes') selectCoin(null);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  if (b.hasAttribute('data-new')) { draft.img=''; draft.wish=''; draft.priv=false; $('#wishText').value=''; $('#priv').checked=false; clearPad(); }
  show(b.dataset.go);
});

/* ---------- design: draw on the coin ---------- */
const pad = $('#pad'), pg = pad.getContext('2d');
let inked = false, stroke = null;
function clearPad(){ pg.fillStyle='#fff'; pg.fillRect(0,0,pad.width,pad.height); inked=false; }
function padXY(e){ const r=pad.getBoundingClientRect(); return [(e.clientX-r.left)*pad.width/r.width, (e.clientY-r.top)*pad.height/r.height]; }
pad.addEventListener('pointerdown', e => { e.preventDefault(); pad.setPointerCapture(e.pointerId); stroke = padXY(e);
  pg.fillStyle='#111'; pg.beginPath(); pg.arc(stroke[0],stroke[1],5,0,Math.PI*2); pg.fill(); inked = true; });
pad.addEventListener('pointermove', e => { if (!stroke) return; const p = padXY(e);
  pg.strokeStyle='#111'; pg.lineWidth=10; pg.lineCap=pg.lineJoin='round';
  pg.beginPath(); pg.moveTo(stroke[0],stroke[1]); pg.lineTo(p[0],p[1]); pg.stroke(); stroke = p; });
['pointerup','pointercancel','pointerleave'].forEach(t => pad.addEventListener(t, () => stroke = null));
$('#clearPad').onclick = clearPad;
function padImage(){ const c=document.createElement('canvas'); c.width=c.height=240; c.getContext('2d').drawImage(pad,0,0,240,240); return c.toDataURL(); }
$('#toWish').onclick = () => { if (!inked) { toast('Sign or draw on the coin first'); return; } draft.img = padImage(); show('wish'); };
$('#toToss').onclick = () => {
  draft.wish = $('#wishText').value.trim(); draft.priv = $('#priv').checked;
  if (!draft.wish) { toast('Write a wish first'); $('#wishText').focus(); return; }
  show('toss');
};

/* ---------- toss (swipe up) ---------- */
const tc = $('#tossCoin');
let drag = null, tossed = false;
function resetToss(){
  tossed = false; tc.classList.remove('flying'); tc.style.transform = 'translateX(-50%)'; tc.style.opacity = 1;
  $('#tcImg').src = draft.img;
}
tc.addEventListener('pointerdown', e => { if (tossed) return; tc.setPointerCapture(e.pointerId); drag = {y:e.clientY, x:e.clientX, t:performance.now(), dy:0, dx:0}; });
tc.addEventListener('pointermove', e => {
  if (!drag) return; drag.dy = e.clientY - drag.y; drag.dx = e.clientX - drag.x;
  tc.style.transform = `translate(calc(-50% + ${drag.dx*.3}px), ${Math.min(0, drag.dy)}px)`;
});
tc.addEventListener('pointerup', end); tc.addEventListener('pointercancel', end);
function end(){
  if (!drag) return; const d = drag; drag = null;
  const v = -d.dy / Math.max(1, performance.now() - d.t);
  if (d.dy < -90 || (d.dy < -30 && v > .5)) return toss();
  tc.style.transform = 'translateX(-50%)';
  if (Math.abs(d.dy) < 10) toast('Swipe up on the coin to toss it');
}
function toss(){
  tossed = true; $('#tossHint').hidden = true;
  const r = $('#basin').getBoundingClientRect(), c = tc.getBoundingClientRect();
  let pos, tries = 0;
  do { pos = {x:.18 + Math.random()*.64, y:.25 + Math.random()*.5}; }
  while (tries++ < 60 && all().some(c => { const q = c.pos || posFor(c.id); return Math.hypot((q.x-pos.x)*2.6, q.y-pos.y) < .32; }));
  const tx = r.left + r.width*pos.x - (c.left + c.width/2), ty = r.top + r.height*pos.y - (c.top + c.height/2);
  tc.classList.add('flying');
  tc.style.transform = `translate(calc(-50% + ${tx}px), ${ty}px) scale(.2)`;
  tc.style.opacity = .3;
  mine.push({id:'m'+Date.now(), img:draft.img, wish:draft.wish, priv:draft.priv, date:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'}), pos, mine:true});
  save();
  setTimeout(() => show('done'), 750);
}

/* ---------- wishes ---------- */
function posFor(id){ let h=0; for (const ch of id) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  const a = (h % 360) * Math.PI/180, rr = .15 + ((h>>9) % 100)/100*.3; return {x:.5 + Math.cos(a)*rr, y:.5 + Math.sin(a)*rr*.9}; }
function all(){ return [...SAMPLES, ...mine]; }
function renderDots(on){
  const box = $('#dots'); if (!on) { box.innerHTML=''; return; }
  box.innerHTML = all().map(c => { const p = c.pos || posFor(c.id);
    return `<button class="dot${c.mine?' mine':''}" data-id="${c.id}" style="left:${p.x*100}%;top:${p.y*100}%" aria-label="${c.mine?'Your coin':'A visitor\'s coin'}"><img src="${c.img}" alt=""></button>`; }).join('');
}
$('#dots').addEventListener('click', e => { const d = e.target.closest('.dot'); if (!d || cur!=='wishes') return; selectCoin(d.dataset.id); });
function selectCoin(id){
  document.querySelectorAll('.dot').forEach(d => d.classList.toggle('sel', d.dataset.id === id));
  const c = all().find(x => x.id === id), card = $('#wishCard');
  card.classList.toggle('has-coin', !!c);
  if (!c) { card.innerHTML = `<p class="note" style="margin:0">${all().length} coins in the fountain · coins marked “You” are yours</p>`; return; }
  const esc = s => s.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  card.innerHTML = `<img class="thumb" src="${c.img}" alt=""><div>
    <h3>${c.mine ? 'Your coin' : 'A visitor\'s coin'}</h3>
    <p>${c.priv && !c.mine ? '<i>This wish is private.</i>' : '“'+esc(c.wish)+'”'}</p>
    <p class="meta">Tossed ${c.date}${c.mine && c.priv ? ' · private' : ''}</p></div>`;
}

/* ---------- camera ---------- */
let stream = null;
async function camOn(){
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    const v = $('#cam'); v.srcObject = stream; v.hidden = false; $('#ph').hidden = true; await v.play().catch(()=>{});
  } catch(e) { stream = null; toast('Camera not available. Using the placeholder view.'); }
  camLabel();
}
function camOff(){ if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; $('#cam').hidden = true; $('#ph').hidden = false; camLabel(); }
function camLabel(){ document.querySelectorAll('.camBtn').forEach(b => b.textContent = stream ? 'Camera: on' : 'Camera: off'); }
document.querySelectorAll('.camBtn').forEach(b => b.onclick = () => stream ? camOff() : camOn());

let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true, 2200); }

clearPad(); camLabel(); show('home');
if (new URLSearchParams(location.search).has('nocam')) {} else camOn();
</script>
</body>
</html>
